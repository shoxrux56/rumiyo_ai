<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rumiyo</title>
<style>
:root{--bg:#fff7ee;--bg2:#ffe9d2;--surf:#ffffff;--line:#f0d9c0;--tx:#2a1a10;--mut:#8a6a52;--acc:#e8590c;--acc2:#ffb703;--me:#fde3c8;--ok:#2b8a3e}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1410;--bg2:#271b14;--surf:#2a1e17;--line:#4a3527;--tx:#f8ebdd;--mut:#b99a80;--acc:#ff8a3d;--acc2:#ffc233;--me:#4a3220;--ok:#69db7c}}
:root[data-theme="dark"]{--bg:#1b1410;--bg2:#271b14;--surf:#2a1e17;--line:#4a3527;--tx:#f8ebdd;--mut:#b99a80;--acc:#ff8a3d;--acc2:#ffc233;--me:#4a3220;--ok:#69db7c}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 70% at 50% -10%,var(--bg2),var(--bg) 60%) fixed;color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-bottom,0px))}
.scr{max-width:560px;margin:0 auto;height:calc(100vh - 24px);height:calc(100dvh - 24px);display:flex;flex-direction:column;gap:12px}
.hide{display:none!important}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1,h2{margin:0;text-wrap:balance}
h2{font-size:1.15rem}
.chip{background:var(--surf);border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:.85rem;color:var(--mut)}
.topic{font-size:.85rem;color:var(--mut)}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.lead{color:var(--mut);max-width:34ch;margin:0}
.log{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 0}
.m{max-width:88%;padding:10px 14px;border-radius:16px;background:var(--surf);border:1px solid var(--line);align-self:flex-start;overflow-wrap:anywhere}
.m.me{align-self:flex-end;background:var(--me);border-color:transparent}
.m small{display:block;color:var(--mut);margin-top:4px;font-size:.82rem}
.m .ru{display:block;margin-top:6px;font-weight:700;font-size:1.08rem;color:var(--acc)}
.m.fix{align-self:stretch;max-width:100%;background:transparent;border:1px dashed var(--line);color:var(--mut);font-size:.88rem;padding:6px 12px}
.dock{display:flex;flex-direction:column;align-items:center;gap:8px}
.orb{width:84px;height:84px;border-radius:50%;border:0;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;box-shadow:0 6px 24px rgba(232,89,12,.35);transition:transform .15s}
.orb:active{transform:scale(.95)}
.orb.big{width:112px;height:112px}
.orb.rec{animation:pulse 1.1s infinite;background:linear-gradient(135deg,#d6336c,var(--acc))}
.orb:disabled{opacity:.5}
.orb svg{width:38%;height:38%;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round}
@keyframes pulse{50%{box-shadow:0 0 0 16px rgba(232,89,12,.12)}}
.state{min-height:1.5em;text-align:center;color:var(--mut);font-size:.92rem;margin:0}
.btn{display:inline-block;border:0;border-radius:14px;padding:13px 22px;font:inherit;font-weight:600;background:var(--acc);color:#fff;text-decoration:none;cursor:pointer}
.link{background:none;border:0;color:var(--mut);font:inherit;text-decoration:underline;cursor:pointer;padding:6px}
.emoji{font-size:3rem}
.av{width:min(64vw,280px);aspect-ratio:1;margin:0 auto;border-radius:26px;overflow:hidden;background:radial-gradient(circle at 50% 30%,#ffe3bf,#ffb36b);flex:none;box-shadow:0 6px 24px rgba(0,0,0,.25);transition:box-shadow .3s}
.av svg{width:100%;height:100%;display:block}
@keyframes avpop{0%{transform:scale(.3) rotate(-14deg);opacity:0}55%{transform:scale(1.14) rotate(5deg);opacity:1}75%{transform:scale(.96) rotate(-2deg)}100%{transform:scale(1) rotate(0)}}
.av-pop{animation:avpop .85s cubic-bezier(.2,.9,.3,1.2) both}
body.angry .av{box-shadow:0 0 44px rgba(255,40,40,.6)}
.av.fr{background:radial-gradient(circle at 50% 30%,#e3f4ff,#9fd0ff)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:380px}
.pc{border:2px solid var(--line);background:var(--surf);color:inherit;border-radius:16px;padding:12px 10px;font:inherit;text-align:center;cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:center;transition:transform .15s,border-color .15s,box-shadow .15s}
.pc b{font-size:1rem}
.pc span{font-size:.8rem;color:var(--mut);line-height:1.25}
.pc .e{font-size:1.6rem}
.pc[aria-pressed=true]{border-color:var(--acc);box-shadow:0 0 0 3px rgba(232,89,12,.18);transform:translateY(-2px)}
.pc.fr[aria-pressed=true]{border-color:#2f8fe0;box-shadow:0 0 0 3px rgba(47,143,224,.2)}
</style>
</head>
<body>

<section id="s-msg" class="scr hide"><div class="mid"><div class="emoji">🤷</div><h1 id="msg-t"></h1><p id="msg-p" class="lead"></p></div></section>

<section id="s-hello" class="scr hide">
  <div class="mid">
    
    <h1>Ustozingizni tanlang</h1>
    <div class="pick" role="group" aria-label="Ustoz tanlash">
      <button type="button" class="pc fr" id="pc-friendly" aria-pressed="false"><span class="e">😊</span><b>Do'stona ustoz</b><span>«Jonim» deb gaplashadi, hazil bilan o'rgatadi</span></button>
      <button type="button" class="pc" id="pc-angry" aria-pressed="false"><span class="e">😠</span><b>Jahldor ustoz</b><span>Jahli tez, lekin juda kulgili</span></button>
    </div>
    <p class="lead" id="h-topic">Bugungi darsni ruscha gaplashib mustahkamlaymiz. Mikrofonga ruxsat bering.</p>
    <button id="b-go" class="orb big" aria-label="Boshlash"><svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <p class="state">Boshlash uchun bosing</p>
  </div>
</section>

<section id="s-chat" class="scr hide">
  <div class="bar"><div><h2 id="c-name">Rumiyo</h2><div class="topic" id="c-topic"></div></div><span class="chip">Qoldi <b id="left">--:--</b></span></div>
  <div class="av" id="av"></div>
  <div id="log" class="log"></div>
  <div class="dock">
    <button id="b-mic" class="orb" aria-label="Gapirish"><svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <p id="state" class="state">Rumiyo o'ylayapti…</p>
    <button id="b-end" class="link">Tugatish</button>
  </div>
</section>

<section id="s-end" class="scr hide">
  <div class="mid">
    <div class="emoji">👋</div>
    <h1 id="e-t">Ko'rishguncha!</h1>
    <p id="e-p" class="lead"></p>
    <a id="e-bot" class="btn" href="#">Botga qaytish</a>
  </div>
</section>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="vrm/rumiyo-vrm.js"></script>
<script>
/* Rumiyo avatari: jahldor ustoz (2D, SVG). Ko'z pirpiraydi, ko'zlar sichqoncha/barmoqni kuzatadi,
   og'iz ovoz balandligiga qarab ochiladi, jahl/kulgi/yig'i/xursandlik holatlari silliq o'tadi. */
var RumiyoAvatar = (function () {
  var uid = 0;
  function lerp(a, b, t) { return a + (b - a) * t; }
  function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
  function mix(c1, c2, t) {
    var r = [], i;
    for (i = 0; i < 3; i++) r.push(Math.round(lerp(parseInt(c1.substr(1 + i * 2, 2), 16), parseInt(c2.substr(1 + i * 2, 2), 16), clamp(t, 0, 1))));
    return "rgb(" + r.join(",") + ")";
  }
  var E = {   // holatlar: maqsad qiymatlari
    idle:  { brow: 0,    browY: 0,  smile: 0.18, eye: 1,    flush: 0,    steam: 0, shake: 0, tears: 0, laugh: 0, happy: 0, bob: 0.15 },
    speak: { brow: -0.3, browY: 1,  smile: -0.1, eye: 0.95, flush: 0.18, steam: 0, shake: 0.1, tears: 0, laugh: 0, happy: 0, bob: 0.3 },
    angry: { brow: -1,   browY: 3,  smile: -0.85, eye: 0.7, flush: 1,    steam: 1, shake: 1, tears: 0, laugh: 0, happy: 0, bob: 0.2 },
    laugh: { brow: 0.45, browY: -5, smile: 1,    eye: 1,    flush: 0.3,  steam: 0, shake: 0, tears: 0.35, laugh: 1, happy: 0, bob: 1 },
    cry:   { brow: 1,    browY: -2, smile: -0.7, eye: 0.82, flush: 0.12, steam: 0, shake: 0.15, tears: 1, laugh: 0, happy: 0, bob: 0.2 },
    happy: { brow: 0.5,  browY: -6, smile: 1,    eye: 1.08, flush: 0.1,  steam: 0, shake: 0, tears: 0, laugh: 0, happy: 1, bob: 0.6 },
    warm:  { brow: 0.3,  browY: -3, smile: 0.7,  eye: 1.04, flush: 0.05, steam: 0, shake: 0, tears: 0, laugh: 0, happy: 0.5, bob: 0.35 }
  };

  function build(host) {
    var id = "ra" + (++uid);
    host.innerHTML =
      '<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rumiyo">' +
      '<defs><clipPath id="' + id + 'm"><path id="' + id + 'mc" d=""/></clipPath>' +
      '<radialGradient id="' + id + 'g" cx="50%" cy="38%" r="75%"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>' +
      '<rect id="' + id + 'bg" width="300" height="300" fill="#ffcf99"/><rect width="300" height="300" fill="url(#' + id + 'g)"/>' +
      '<g id="' + id + 'rays" opacity="0" stroke="#ffe27a" stroke-width="5" stroke-linecap="round"></g>' +
      '<g id="' + id + 'body"><path d="M40 300 Q46 238 112 226 L188 226 Q254 238 260 300 Z" fill="#2f6f5e"/>' +
      '<path d="M112 226 L150 262 L188 226 Z" fill="#f3c7a1"/>' +
      '<path d="M96 300 L108 236 M126 300 L130 250 M174 300 L170 250 M204 300 L192 236" stroke="#f2c14e" stroke-width="5" opacity=".85"/></g>' +
      '<g id="' + id + 'hd">' +
        '<g id="' + id + 'steamL"></g><g id="' + id + 'steamR"></g>' +
        '<circle cx="60" cy="168" r="21" fill="#e9b088"/><circle cx="60" cy="168" r="10" fill="#d99a72"/>' +
        '<circle cx="240" cy="168" r="21" fill="#e9b088"/><circle cx="240" cy="168" r="10" fill="#d99a72"/>' +
        '<ellipse cx="150" cy="170" rx="92" ry="98" fill="#f3c7a1" stroke="#c98d63" stroke-width="3"/>' +
        '<ellipse id="' + id + 'fl" cx="150" cy="170" rx="92" ry="98" fill="#ff3b30" opacity="0"/>' +
        '<ellipse cx="86" cy="196" rx="20" ry="13" fill="#ff7a7a" opacity=".28"/><ellipse cx="214" cy="196" rx="20" ry="13" fill="#ff7a7a" opacity=".28"/>' +
        '<g id="' + id + 'dp"><path d="M62 116 Q60 66 104 54 L196 54 Q240 66 238 116 Q150 140 62 116 Z" fill="#1c1c34"/>' +
          '<path d="M62 116 Q150 140 238 116 L236 102 Q150 124 64 102 Z" fill="#2c2c52"/>' +
          '<g fill="none" stroke="#f6f0dc" stroke-width="3" stroke-linejoin="round"><path d="M96 92 L112 76 L128 92 L112 108 Z"/><path d="M136 92 L152 76 L168 92 L152 108 Z"/><path d="M176 92 L192 76 L208 92 L192 108 Z"/></g>' +
          '<circle cx="112" cy="92" r="3" fill="#f2c14e"/><circle cx="152" cy="92" r="3" fill="#f2c14e"/><circle cx="192" cy="92" r="3" fill="#f2c14e"/></g>' +
        '<g id="' + id + 'eL"><ellipse cx="0" cy="0" rx="21" ry="18" fill="#fff" stroke="#6b4a36" stroke-width="2"/><g class="pp"><circle cx="0" cy="0" r="9.5" fill="#3b2314"/><circle cx="0" cy="0" r="4.6" fill="#0c0603"/><circle cx="-3.4" cy="-3.6" r="2.7" fill="#fff"/></g></g>' +
        '<g id="' + id + 'eR"><ellipse cx="0" cy="0" rx="21" ry="18" fill="#fff" stroke="#6b4a36" stroke-width="2"/><g class="pp"><circle cx="0" cy="0" r="9.5" fill="#3b2314"/><circle cx="0" cy="0" r="4.6" fill="#0c0603"/><circle cx="-3.4" cy="-3.6" r="2.7" fill="#fff"/></g></g>' +
        '<path id="' + id + 'aL" d="M-19 5 Q0 -17 19 5" fill="none" stroke="#2a1608" stroke-width="6" stroke-linecap="round" opacity="0"/>' +
        '<path id="' + id + 'aR" d="M-19 5 Q0 -17 19 5" fill="none" stroke="#2a1608" stroke-width="6" stroke-linecap="round" opacity="0"/>' +
        '<g id="' + id + 'tL" opacity="0"><path d="M0 -9 Q9 6 0 12 Q-9 6 0 -9Z" fill="#6fc8ff" stroke="#2a8fd0" stroke-width="1.5"/></g>' +
        '<g id="' + id + 'tR" opacity="0"><path d="M0 -9 Q9 6 0 12 Q-9 6 0 -9Z" fill="#6fc8ff" stroke="#2a8fd0" stroke-width="1.5"/></g>' +
        '<g id="' + id + 'tL2" opacity="0"><path d="M0 -9 Q9 6 0 12 Q-9 6 0 -9Z" fill="#6fc8ff" stroke="#2a8fd0" stroke-width="1.5"/></g>' +
        '<g id="' + id + 'tR2" opacity="0"><path d="M0 -9 Q9 6 0 12 Q-9 6 0 -9Z" fill="#6fc8ff" stroke="#2a8fd0" stroke-width="1.5"/></g>' +
        '<g id="' + id + 'bL"><path d="M-30 0 Q0 -14 30 0" fill="none" stroke="#17120e" stroke-width="13" stroke-linecap="round"/></g>' +
        '<g id="' + id + 'bR"><path d="M-30 0 Q0 -14 30 0" fill="none" stroke="#17120e" stroke-width="13" stroke-linecap="round"/></g>' +
        '<ellipse id="' + id + 'ns" cx="150" cy="190" rx="14" ry="12" fill="#e5a679" stroke="#c98d63" stroke-width="2"/>' +
        '<g id="' + id + 'mouth"><path id="' + id + 'mp" d="" fill="#4a0d18" stroke="#2a0509" stroke-width="4" stroke-linejoin="round"/>' +
          '<g clip-path="url(#' + id + 'm)"><rect id="' + id + 'th" x="90" y="200" width="120" height="14" fill="#fffdf6"/><ellipse id="' + id + 'tg" cx="150" cy="250" rx="22" ry="11" fill="#e8607a"/></g></g>' +
        '<g id="' + id + 'ms"><path d="M150 214 Q128 196 96 214 Q108 232 132 224 Q144 222 150 224 Z" fill="#17120e"/><path d="M150 214 Q172 196 204 214 Q192 232 168 224 Q156 222 150 224 Z" fill="#17120e"/></g>' +
        '<g id="' + id + 'mk" opacity="0" stroke="#e11d1d" stroke-width="6" stroke-linecap="round" fill="none"><path d="M-4 -16 Q-4 -6 -15 -4M4 -16 Q4 -6 15 -4M-4 16 Q-4 6 -15 4M4 16 Q4 6 15 4"/></g>' +
      '</g></svg>';
    return id;
  }

  function create(host) {
    var id = build(host);
    var $ = function (s) { return host.querySelector("#" + id + s); };
    var el = { bg: $("bg"), rays: $("rays"), hd: $("hd"), body: $("body"), dp: $("dp"), fl: $("fl"), eL: $("eL"), eR: $("eR"), aL: $("aL"), aR: $("aR"),
      bL: $("bL"), bR: $("bR"), ns: $("ns"), mp: $("mp"), mc: $("mc"), th: $("th"), tg: $("tg"), ms: $("ms"), mk: $("mk"),
      tL: $("tL"), tR: $("tR"), tL2: $("tL2"), tR2: $("tR2"), sL: $("steamL"), sR: $("steamR") };
    var ppL = el.eL.querySelector(".pp"), ppR = el.eR.querySelector(".pp");
    var i, rays = "";
    for (i = 0; i < 12; i++) { var a = i / 12 * Math.PI * 2; rays += '<line x1="' + (150 + Math.cos(a) * 118) + '" y1="' + (150 + Math.sin(a) * 118) + '" x2="' + (150 + Math.cos(a) * 146) + '" y2="' + (150 + Math.sin(a) * 146) + '"/>'; }
    el.rays.innerHTML = rays;
    var puffs = [];
    function mkPuffs(g) { for (var k = 0; k < 3; k++) { var c = document.createElementNS("http://www.w3.org/2000/svg", "circle"); c.setAttribute("fill", "#fff"); c.setAttribute("opacity", "0"); g.appendChild(c); puffs.push({ c: c, side: g === el.sL ? -1 : 1, k: k }); } }
    mkPuffs(el.sL); mkPuffs(el.sR);

    var cur = {}, tgt = {}, k0;
    for (k0 in E.idle) { cur[k0] = E.idle[k0]; tgt[k0] = E.idle[k0]; }
    var S = { emo: "idle", talking: false, ana: null, buf: null, lvl: 0, open: 0, blink: 0, nextBlink: 1.5, look: { x: 0, y: 0 }, lookT: { x: 0, y: 0 }, intro: 0, poke: 0, t0: performance.now(), last: performance.now(), raf: 0, paused: false, pokeEmo: null, hold: 0 };

    function set(name) { if (!E[name]) name = "speak"; S.emo = name; for (var k in E[name]) tgt[k] = E[name][k]; }
    function level() {
      if (S.ana) {
        if (!S.buf) S.buf = new Uint8Array(S.ana.fftSize);
        S.ana.getByteTimeDomainData(S.buf);
        var s = 0, j; for (j = 0; j < S.buf.length; j++) { var v = (S.buf[j] - 128) / 128; s += v * v; }
        return clamp(Math.sqrt(s / S.buf.length) * 4.2, 0, 1);
      }
      if (S.talking) { var t = (performance.now() - S.t0) / 1000; return clamp(0.45 + 0.4 * Math.sin(t * 13) * Math.sin(t * 5.3 + 1) + 0.15 * Math.sin(t * 31), 0.05, 1); }
      return 0;
    }
    function mouthPath(w, cy, s, open) {
      var cornerY = cy - s * 16, up = cy + 10 * s, low = up + open * 72;
      var L = 150 - w, R = 150 + w;
      return "M" + L + " " + cornerY + " Q150 " + up + " " + R + " " + cornerY + " Q150 " + low + " " + L + " " + cornerY + " Z";
    }
    function frame(now) {
      S.raf = requestAnimationFrame(frame);
      if (S.paused || document.hidden) { S.last = now; return; }
      var dt = Math.min(0.05, (now - S.last) / 1000); S.last = now;
      var t = (now - S.t0) / 1000, kk = 1 - Math.exp(-dt * 9), k;
      for (k in cur) cur[k] += (tgt[k] - cur[k]) * kk;
      // kirish (intro): ko'zlar katta, qoshlar ko'tarilgan
      if (S.intro > 0) S.intro = Math.max(0, S.intro - dt);
      var intro = S.intro > 0 ? Math.sin(Math.min(1, S.intro / 1.1) * Math.PI) : 0;
      // turtki (poke): bosilganda qisqa jahl
      var emoNow = S.emo;
      if (S.hold > 0) { S.hold -= dt; if (S.hold <= 0) { S.hold = 0; set(S.pokeEmo || "idle"); } }
      var lv = level(); S.lvl += (lv - S.lvl) * (1 - Math.exp(-dt * 24));
      var openT;
      if (cur.laugh > 0.5) openT = 0.5 + 0.38 * Math.abs(Math.sin(t * 17));
      else if (cur.tears > 0.8) openT = 0.12 + S.lvl * 0.7 + 0.1 * Math.sin(t * 9);
      else openT = S.lvl * 1.15 + (cur.happy > 0.5 ? 0.18 : 0) + (cur.steam > 0.5 && S.lvl > 0.03 ? 0.14 : 0);
      S.open += (clamp(openT, 0, 1) - S.open) * (1 - Math.exp(-dt * 28));
      // ko'z pirpirashi
      S.nextBlink -= dt;
      if (S.nextBlink <= 0 && S.blink === 0) { S.blink = 0.0001; }
      if (S.blink > 0) { S.blink += dt / 0.16; if (S.blink >= 2) { S.blink = 0; S.nextBlink = 1.8 + Math.random() * 3.8; } }
      var bl = S.blink > 0 ? (S.blink < 1 ? S.blink : 2 - S.blink) : 0;
      // qarash
      S.look.x += (S.lookT.x - S.look.x) * (1 - Math.exp(-dt * 10)); S.look.y += (S.lookT.y - S.look.y) * (1 - Math.exp(-dt * 10));
      var idleLx = Math.sin(t * 0.7) * 2.2 + Math.sin(t * 1.9) * 1, idleLy = Math.sin(t * 0.9 + 1) * 1.4;
      var lx = S.look.x * 7 + idleLx, ly = S.look.y * 6 + idleLy;
      var angry = cur.steam, shake = cur.shake * (angry > 0.4 ? 1 : 0.25);
      // bosh
      var hx = Math.sin(t * 46) * shake * 2.4, hy = Math.sin(t * 2) * 1.6 * (1 - cur.laugh) + (cur.laugh > 0.3 ? -Math.abs(Math.sin(t * 14)) * 7 * cur.laugh : 0) + (S.lvl * 2.2);
      var hr = Math.sin(t * 13) * 3.5 * cur.laugh + Math.sin(t * 1.3) * 0.9 + Math.sin(t * 33) * shake * 1.1 + (cur.tears > 0.5 ? Math.sin(t * 6) * 1.5 : 0);
      var hs = 1 + 0.012 * Math.sin(t * 2.1) + S.lvl * 0.012 + intro * 0.04;
      el.hd.setAttribute("transform", "translate(" + (150 + hx) + " " + (190 + hy) + ") rotate(" + hr + ") scale(" + hs + ") translate(-150 -190)");
      el.body.setAttribute("transform", "translate(0 " + (Math.sin(t * 2 + 0.6) * 1.4 + (cur.laugh > 0.3 ? Math.abs(Math.sin(t * 14)) * 3 : 0)) + ")");
      // doppi sakraydi (jahlda)
      el.dp.setAttribute("transform", "translate(0 " + (-10 - (angry * Math.abs(Math.sin(t * 19))) * 4.5) + ")");

        if (!L.ready || L.muted || ws.readyState !== 1) return;
        if (L.ptt && !L.talking && L.pre.length > 8) L.pre.shift();
        var f = e.inputBuffer.getChannelData(0), n = Math.floor(f.length / ratio), o = new Int16Array(n);
        for (var i = 0; i < n; i++) {
          var a = Math.floor(i * ratio), b = Math.min(f.length, Math.floor((i + 1) * ratio)), sum = 0, c = 0;
          for (var k = a; k < b; k++) { sum += f[k]; c++; }
          var v = c ? sum / c : 0; v = Math.max(-1, Math.min(1, v)); o[i] = v < 0 ? v * 32768 : v * 32767;
        }
        if (L.ptt && !L.talking) { if (!L.talkTail) { L.pre.push(o.buffer); return; } }   // tugma bosilmaguncha ovoz yuborilmaydi
        ws.send(o.buffer);
      };
      srcNode.connect(L.proc); L.proc.connect(L.cin.destination);
    } catch (e) { return liveFail(); }
    ws.onmessage = function (e) {
      if (L.closed) return;
      if (typeof e.data !== "string") { livePlay(L, e.data); return; }
      var o; try { o = JSON.parse(e.data); } catch (x) { return; }
      if (o.t === "ready") { L.ready = true; L.ptt = o.ptt !== false; setLeft(o.left); $("b-mic").disabled = false; if (L.ptt) { state("Rumiyo salom beryapti… gapirmoqchi bo'lsangiz tugmani bosing"); } else { $("b-mic").classList.add("rec"); state("Eshityapman… istagan payt gapiring, Rumiyo to'xtaydi"); } }
      else if (o.t === "in") { if (!L.curMe) L.curMe = mkBubble("me"); L.curMe.textContent += o.text; L.curAi = null; $("log").scrollTop = 1e9; }
      else if (o.t === "out") { if (!L.curAi) L.curAi = mkBubble("ai"); L.curAi.textContent += o.text; L.curMe = null; $("log").scrollTop = 1e9; L.outText = (L.outText || "") + o.text; var mo = moodFrom(L.outText); if (mo !== "speak") L.mood = mo; if (L.srcs.length) setAv(L.mood || "speak"); }
      else if (o.t === "int") { liveStopPlay(L); L.curAi = null; }
      else if (o.t === "turn") { L.curMe = null; L.curAi = null; L.outText = ""; L.mood = "speak"; if (L.ptt && !L.talking) state("Sizning navbatingiz: tugmani bosib gapiring 🎙"); }
      else if (o.t === "left") { setLeft(o.left); }
      else if (o.t === "nolive") { liveFail(); }
      else if (o.t === "error") { liveCleanup(); state(o.error || "Xatolik"); }
      else if (o.t === "done") { var d = o; setTimeout(function () { liveCleanup(); finish(d); }, 1500); }
    };
    ws.onclose = function () { if (!L.closed && !L.ready) liveFail(); else if (!L.closed) { liveCleanup(); finish({ cta: "Aloqa uzildi. Botga qayting 👇" }); } };
    ws.onerror = function () { if (!L.closed && !L.ready) liveFail(); };
  }

  function begin() {
    if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) || !window.MediaRecorder) {
      return noMic("Mikrofon bu yerda ishlamaydi", "Mikrofon ochilmadi. Qurilma sozlamasidan mikrofonga ruxsat bering.");
    }
    navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } }).then(function (s) {
      mic = s; $("log").innerHTML = ""; show("s-chat"); setAv("idle"); state("Rumiyo o'ylayapti…"); $("b-mic").disabled = true;
      post("ai/start", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token: token, live: true, persona: persona }) }).then(function (j) {
        if (j.done && !(j.ru || j.uz)) return finish(j);
        if (j.error) { state(j.error); return; }
        if (j.bot) botUrl = j.bot;
        $("c-topic").textContent = j.topic ? "Mavzu: " + j.topic : "";
        if (j.live) return liveStart(j);
        return classicShow(j);
      }).catch(function () { state("Aloqa xatosi. Sahifani yangilang."); });
    }).catch(function () {
      noMic("Mikrofon yopiq", "Telegram sozlamasidan mikrofonga ruxsat bering va qayta oching.");
    });
  }

  function pickMime() {
    var c = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg;codecs=opus"];
    for (var i = 0; i < c.length; i++) { if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(c[i])) return c[i]; }
    return "";
  }
  function stopRec() { try { if (recorder && recorder.state !== "inactive") recorder.stop(); } catch (e) {} }

  function micToggle() {
    if (live && !live.closed) return liveMute();
    if (busy || !mic) return;
    if (rec) return stopRec();
    if (speaking) { speaking = false; stopSpeak(); }
    var mime = pickMime();
    try { recorder = new MediaRecorder(mic, mime ? { mimeType: mime } : undefined); } catch (e) { return state("Mikrofon ishlamadi"); }
    chunks = []; var t0 = Date.now(), spoke = false, silent = 0, timer = null;
    recorder.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
    recorder.onstop = function () {
      clearInterval(timer); rec = false; $("b-mic").classList.remove("rec");
      var dur = Math.max(1, Math.round((Date.now() - t0) / 1000));
      send(new Blob(chunks, { type: recorder.mimeType || mime || "audio/webm" }), dur);
    };
    try {   // jim qolsa o'zi to'xtaydi
      var AC = window.AudioContext || window.webkitAudioContext; ctx = ctx || new AC();
      var an = ctx.createAnalyser(); an.fftSize = 512; ctx.createMediaStreamSource(mic).connect(an);
      var buf = new Uint8Array(an.fftSize);
      timer = setInterval(function () {
        an.getByteTimeDomainData(buf); var mx = 0;
        for (var i = 0; i < buf.length; i++) mx = Math.max(mx, Math.abs(buf[i] - 128));
        var now = Date.now();
        if (mx > 14) { spoke = true; silent = 0; } else if (spoke && !silent) silent = now;
        if ((spoke && silent && now - silent > 1000) || now - t0 > 30000) stopRec();
      }, 150);
    } catch (e) { timer = setInterval(function () { if (Date.now() - t0 > 30000) stopRec(); }, 500); }
    recorder.start(); rec = true; setAv("idle"); $("b-mic").classList.add("rec"); state("Eshityapman… gapirib bo'lgach tugmani bosing");
  }

  function send(blob, dur) {
    busy = true; $("b-mic").disabled = true; state("Rumiyo o'ylayapti…");
    var bubble = null, uzAcc = "", spoke = false, final = null, myId = ++spkId, ac = ("AbortController" in window) ? new AbortController() : null, gotAny = false;
    var wd = setTimeout(function () {
      if (myId !== spkId || gotAny) return;
      spkId++; try { if (ac) ac.abort(); } catch (e) {}
      busy = false; $("b-mic").disabled = false; state("Javob juda kechikdi (server uyg'onayotgan bo'lishi mumkin). Tugmani bosib qayta ayting");
    }, 35000);
    Q = []; qPlaying = false; qEnd = null; qPlayed = false;
    function ensureBubble() {
      if (bubble) return;
      bubble = document.createElement("div"); bubble.className = "m ai"; $("log").appendChild(bubble);
    }
    function startSpeaking(emo) {
      if (spoke) return; spoke = true; busy = false; speaking = true; setAv(emoClip(emo));
      $("b-mic").disabled = false; state("Gapirish uchun tugmani bosing (Rumiyo to'xtaydi)");
    }
    function speechEnded(j) {
      speaking = false;
      if (j.done) return finish(j);
      if (rec) return;
      setAv("idle"); $("b-mic").disabled = false; state("Tugmani bosib javob bering");
    }
    function onEvent(o) {
      if (myId !== spkId) return;
      gotAny = true; clearTimeout(wd);
      if (o.t === "heard") { log("me", o.heard); }
      else if (o.t === "uz") {
        ensureBubble(); uzAcc += (uzAcc ? " " : "") + o.text; bubble.textContent = uzAcc;
        startSpeaking(o.emo); qAdd(o.text, "uz", o.emo); $("log").scrollTop = 1e9;
      } else if (o.t === "error") {
        busy = false; speaking = false; $("b-mic").disabled = false; state(o.error + " Tugmani bosing");
      } else if (o.t === "final") {
        final = o;
        if (o.fix) log("fix", "✏️ " + o.fix);
        ensureBubble();
        if (!spoke) { bubble.textContent = o.uz || ""; startSpeaking(o.emo); chunkText(o.uz).forEach(function (t) { qAdd(t, "uz", o.emo); }); }
        if (o.ru) { var b = document.createElement("b"); b.className = "ru"; b.textContent = FLAG + o.ru; bubble.appendChild(b); qAdd(o.ru, "ru", o.emo); }
        setLeft(o.left); setAv(emoClip(o.emo)); $("log").scrollTop = 1e9;
        var hold = Math.min(6000, 1200 + ((o.uz || "").length + (o.ru || "").length) * 60);
        qWhenDone(function () { if (myId !== spkId) return; if (qPlayed) speechEnded(o); else setTimeout(function () { if (myId === spkId) speechEnded(o); }, hold); });
      }
    }
    fetch("ai/turn", { method: "POST", headers: { "X-Token": token, "X-Persona": persona, "X-Dur": String(dur), "Content-Type": (blob.type || "audio/webm").split(";")[0] }, body: blob, signal: ac ? ac.signal : undefined })
      .then(function (r) {
        var ct = r.headers.get("Content-Type") || "";
        if (ct.indexOf("ndjson") < 0) clearTimeout(wd);
        if (ct.indexOf("ndjson") < 0) {          // oddiy JSON: xato yoki vaqt tugagan
          return r.json().then(function (j) {
            if (j.done && !(j.ru || j.uz)) return finish(j);
            busy = false; $("b-mic").disabled = false; state((j.error || "Xatolik.") + " Tugmani bosing");
          });
        }
        var rd = r.body && r.body.getReader ? r.body.getReader() : null, dec = new TextDecoder(), buf = "";
        if (!rd) return r.text().then(function (t) { t.split("\n").forEach(function (l) { if (l.trim()) onEvent(JSON.parse(l)); }); });
        function pump() {
          return rd.read().then(function (x) {
            if (x.done) { if (buf.trim()) { try { onEvent(JSON.parse(buf)); } catch (e) {} } return; }
            buf += dec.decode(x.value, { stream: true });
            var parts = buf.split("\n"); buf = parts.pop();
            parts.forEach(function (l) { if (l.trim()) { try { onEvent(JSON.parse(l)); } catch (e) {} } });
            return pump();
          });
        }
        return pump();
      }).catch(function () { if (myId !== spkId) return; busy = false; $("b-mic").disabled = false; state("Aloqa xatosi. Tugmani qayta bosing"); });
  }

  try { if (window.Telegram && Telegram.WebApp) { Telegram.WebApp.ready(); Telegram.WebApp.expand(); } } catch (e) {}
  $("b-go").onclick = begin;
  // Jonli rejimda tugma darhol (bosilganda) ishlaydi: tez bossangiz - yoqiladi/o'chadi, bosib tursangiz - qo'yib yuborganda yuboriladi
  $("b-mic").addEventListener("pointerdown", function (e) {
    var L = live; if (!L || L.closed || !L.ready || !L.ptt) return;
    e.preventDefault();
    if (L.talking) { L.ignoreUp = true; liveTalkOff(L); } else { L.ignoreUp = false; L.pressAt = Date.now(); liveTalkOn(L); }
  });
  function micRelease() {
    var L = live; if (!L || L.closed || !L.ptt) return;
    if (L.talking && !L.ignoreUp && L.pressAt && Date.now() - L.pressAt > 600) liveTalkOff(L);
    L.pressAt = 0;
  }
  $("b-mic").addEventListener("pointerup", micRelease);
  $("b-mic").addEventListener("pointercancel", micRelease);
  $("b-mic").onclick = function () { if (live && !live.closed && live.ptt) return; micToggle(); };
  $("b-end").onclick = function () {
    if (live && !live.closed) { try { live.ws.send(JSON.stringify({ t: "end" })); } catch (e) {} var L0 = live; setTimeout(function () { if (!L0.closed) { liveCleanup(); finish({ cta: "Yaxshi gaplashdik! Botga qayting 👇" }); } }, 2500); return; }
    speaking = false; stopSpeak(); stopRec();
    fetch("ai/end", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token: token }) }).catch(function () {});
    finish({ cta: "Yaxshi gaplashdik! Botga qayting 👇" });
  };

  if (!token) { $("msg-t").textContent = "Bot orqali oching"; $("msg-p").textContent = "Bu sahifa botda dars testidan keyin chiqadigan «AI bilan suhbat» tugmasi orqali ochiladi."; show("s-msg"); }
  else show("s-hello");
})();
</script>
